<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Editor</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="main-container"  >
        <div class="edit-tools">
            <div class="head-toolbar">
                <input type="text" placeholder="File Name" value="File Name" id="filename" >

                <select id="file-save">
                    <option value="" selected="true" hidden >File</option>
                    <option value="">New File</option>
                    <option value="">Save As PDF</option>
                    <option value="">Save As Text</option>
                </select>

                <select id="format">
                    <option value="" selected="true" hidden >Format</option>
                    <option value="">Heading 1</option>
                    <option value="">Heading 2</option>
                    <option value="">Heading 3</option>
                    <option value="">Heading 4</option>
                    <option value="">Heading 5</option>
                    <option value="">Heading 6</option>
                    <option value="">Paragraph</option>
                    
                </select>

                <select id="font-size">
                    <option value="" selected="true" hidden >Font Size</option>
                    <option value="">Extra Small</option>
                    <option value="">Small</option>
                    <option value="">Medium</option>
                    <option value="">Large</option>
                    <option value="">Extra Large</option>
                    <option value="">Big</option>
                   
                    
                </select>

                <div class="color-picker-container">
                    <span>Color</span>
                    <input type="color" id="color-picker" >
                </div>

                <div class="backgroundColor-picker-container">
                    <span>Background Color</span>
                    <input type="color" id="backgroundColor-picker" >
                </div>
            </div>
            <div class="button-toolbar"></div>
        </div>
        <div class="editable-container" contenteditable="true"></div>
    </div>
    <script src="index.js"></script>
</body>
</html>
